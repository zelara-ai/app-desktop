[package]
name = "zelara-core"
version = "0.6.0"
description = "Zelara Core — local AI hub (Tauri + React)"
authors = ["Zelara AI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zelara_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-native-tls = "0.3"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"
tokio-tungstenite = "0.24"
futures-util = "0.3"
qrcode = "0.14"
image = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
native-tls = "0.2"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
chrono = "0.4"
dirs = "5.0"
local-ip-address = "0.6"
if-addrs = "0.13"

# Phase 5: AI Runtime Platform
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "directml"] }
ndarray = "0.16"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"] }
sysinfo = "0.33"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Phase 5: File import parsers
csv = "1.3"
calamine = { version = "0.26", features = ["dates"] }
quick-xml = "0.37"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Devices_Bluetooth_Advertisement",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_Power",
] }
